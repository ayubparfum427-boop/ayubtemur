<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEMURIY BUSINESS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout idea: black sidebar rail + light work area; emerald marks action and state; numbers in tabular Manrope, brand in Cormorant */
:root{
  --brand:#145A3A; --brand-hi:#1B7A50; --brand-soft:#E3EFE8; --on-brand:#FFFFFF;
  --bg:#F4F6F4; --surface:#FFFFFF; --surface-2:#F8FAF8; --ink:#151515; --ink-2:#5A625D; --line:#E1E6E2;
  --side:#151515; --side-ink:#E9EEEA; --side-dim:#8E9892;
  --ok:#1E8A55; --warn:#A8700F; --bad:#B42318; --okb:#E1F3E9; --warnb:#FBF0DA; --badb:#FBE4E1;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(20,90,58,.06);
  --fd:'Cormorant Garamond',Georgia,serif; --fb:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#3DB07C; --brand-hi:#52C48F; --brand-soft:#16261E; --on-brand:#06140C;
  --bg:#0E100F; --surface:#151716; --surface-2:#1A1D1B; --ink:#F1F4F2; --ink-2:#9BA59F; --line:#262B28;
  --side:#0A0B0A; --ok:#4CC48B; --warn:#E3A93C; --bad:#F0776B; --okb:#13261C; --warnb:#2A2212; --badb:#2C1715;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --brand:#3DB07C; --brand-hi:#52C48F; --brand-soft:#16261E; --on-brand:#06140C;
  --bg:#0E100F; --surface:#151716; --surface-2:#1A1D1B; --ink:#F1F4F2; --ink-2:#9BA59F; --line:#262B28;
  --side:#0A0B0A; --ok:#4CC48B; --warn:#E3A93C; --bad:#F0776B; --okb:#13261C; --warnb:#2A2212; --badb:#2C1715;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}
#app{display:flex;height:100%}
#side{width:252px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;gap:6px;z-index:30;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .mk{width:34px;height:34px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font:700 20px var(--fd);color:#fff;flex:none}
.brand b{font:700 19px/1 var(--fd);letter-spacing:.08em}
.brand small{display:block;font-size:10.5px;letter-spacing:.2em;color:var(--side-dim);margin-top:3px}
.nv{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--side-dim);cursor:pointer;text-align:left;font-weight:600}
.nv svg{width:19px;height:19px;flex:none}
.imgp{display:flex;gap:12px;align-items:center}.imgv{width:96px;height:96px;border:1px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;background:var(--surface)}.imgv img{width:100%;height:100%;object-fit:contain}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lockcard{width:100%;max-width:340px}
.locksel{margin-top:26px;text-align:center}
.locklogo{display:flex;flex-direction:column;align-items:center;gap:8px}
.locklogo .mk{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px}
.locklogo b{font-size:17px}
.pindots{display:flex;gap:12px;justify-content:center;margin:16px 0 8px}
.pindots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:inline-block;transition:background .15s,border-color .15s}
.pindots span.f{background:var(--brand);border-color:var(--brand)}
.pindots span.err{background:var(--bad);border-color:var(--bad)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:10px auto 0}
.pinpad button{font-size:20px;font-weight:800;padding:16px 0;border-radius:12px}
.clockpill{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:99px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;background:var(--brand);color:#fff;margin-left:10px}
.clockpill svg{width:16px;height:16px}
.clockpill small{opacity:.9;font-weight:700;margin-left:2px}
.clockpill.on{background:var(--ink-2,#555)}
.clockpill.pulse{animation:clockpulse 1.6s ease-in-out infinite}
@keyframes clockpulse{0%,100%{box-shadow:0 0 0 0 rgba(20,90,58,.55)}50%{box-shadow:0 0 0 9px rgba(20,90,58,0)}}
#printArea{display:none}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{display:block;position:absolute;left:0;top:0;width:280px;font-family:'Courier New',monospace;font-size:12px;white-space:pre-wrap;color:#000}}

.bdg{font-style:normal;margin-left:auto;background:#d93636;color:#fff;border-radius:99px;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
#bottom .bdg{position:absolute;top:2px;right:calc(50% - 22px);margin:0;min-width:16px;height:16px;font-size:10px}
.tab .bdg{margin-left:6px;min-width:18px;height:18px}
.nv:hover{background:rgba(255,255,255,.06);color:var(--side-ink)}
.nv.on{background:var(--brand);color:#fff}
.sidefoot{margin-top:auto;padding:12px 8px 2px;font-size:11.5px;color:var(--side-dim)}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
#top h1{font:700 24px/1.1 var(--fd);letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--brand-soft)}
.ib svg{width:18px;height:18px}
#menuBtn{display:none}
.rolesel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.rolesel select{padding:7px 8px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2)}
#banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 20px;background:var(--warnb);color:var(--warn);font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line)}
#banner .btn{margin-left:auto}
#tabs{display:flex;gap:4px;padding:10px 20px 0;overflow-x:auto;background:var(--bg);scrollbar-width:thin}
.tab{border:0;background:transparent;padding:9px 14px;border-radius:10px 10px 0 0;color:var(--ink-2);font-weight:700;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
#view{flex:1;overflow:auto;padding:18px 20px 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{font:700 20px/1.2 var(--fd);margin-bottom:10px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gA{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.kpi{padding:14px 16px}
.kpi small{display:block;color:var(--ink-2);font-weight:600;font-size:12px;margin-bottom:4px}
.kpi b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-weight:800}
.kpi span{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.kpi.hl{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.kpi.hl small,.kpi.hl span{color:inherit;opacity:.8}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--brand-soft)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-hi)}
.btn.bad{color:var(--bad);border-color:var(--badb)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.ok{background:var(--okb);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warnb);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--badb);color:var(--bad);border-color:transparent}
.pill.br{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);text-align:left;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right}.t .c{text-align:center}
.t .act{white-space:nowrap;text-align:right}
.t .act .btn{margin-left:4px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.bar{fill:var(--brand);opacity:.55}.bar.last{opacity:1}
.chart{width:100%;height:auto;min-width:420px;display:block}
.chart .lb{fill:var(--ink-2);font-size:9.5px}
.chartw{overflow-x:auto}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hb .tr{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.hb .tr i{display:block;height:100%;background:var(--brand);border-radius:99px}
.hb .tr i.warn{background:var(--warn)}.hb .tr i.bad{background:var(--bad)}
.hb b{font-variant-numeric:tabular-nums}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.fd{display:flex;flex-direction:column;gap:5px;min-width:0}
.fd>span{font-size:12px;font-weight:700;color:var(--ink-2)}
.fd small{color:var(--ink-2);font-size:11.5px}
input,select,textarea{padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-width:0;width:100%}
.fbar input,.fbar select{width:auto}
textarea{resize:vertical}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg .full{grid-column:1/-1}
#modal{display:none;position:fixed;inset:0;z-index:60;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.mbk{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.mdl{position:relative;background:var(--surface);border-radius:16px;width:min(520px,100%);max-height:92%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--line)}
.mdl.wide{width:min(760px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{font:700 22px var(--fd)}
.mb{padding:16px 18px;overflow:auto}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.ferr{margin:0 18px 8px;padding:8px 12px;background:var(--badb);color:var(--bad);border-radius:9px;font-weight:600;font-size:13px}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.ts{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:11px;font-weight:600;box-shadow:var(--shadow);max-width:min(92vw,460px);animation:tin .2s ease}
.ts.bad{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pos{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:14px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pc:hover{border-color:var(--brand);background:var(--brand-soft)}
.pc[disabled]{opacity:.5;cursor:not-allowed}
.pcw{display:flex;flex-direction:column;gap:5px}.pcw>.pc{flex:1}
.pc svg{width:100%;height:64px}
.pc b{font-size:13px}.pc small{color:var(--ink-2)}
.cl{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{border:0;background:var(--surface-2);width:28px;height:28px;cursor:pointer}
.qty span{min-width:30px;text-align:center;font-weight:700}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.tot.big{font-size:18px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kc{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.kc h4{font-size:12.5px;margin-bottom:8px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px}
.idea p{margin:2px 0 6px;color:var(--ink-2);font-size:12.5px}
.al{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:11px;margin-bottom:8px;cursor:pointer;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.al.bad{background:var(--badb);color:var(--bad);border-color:transparent}.al.warn{background:var(--warnb);color:var(--warn);border-color:transparent}
.al span{color:var(--ink)}.al svg{width:18px;height:18px;flex:none}
.mut{color:var(--ink-2)}.sm{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.pre{font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px}
.qrbox{background:#fff;padding:8px;border-radius:10px;display:inline-block;line-height:0}
.qrbox svg{width:150px;height:150px}
.navrow{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line)}
.navrow.sub{padding-left:34px;background:var(--surface-2)}
.navrow b{flex:1}
.navrow.off b{text-decoration:line-through;opacity:.55}
#bottom{display:none}
#cab{min-height:100%;background:var(--bg)}
.cabtop{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--side);color:#fff;flex-wrap:wrap}
.cabtop .brand{padding:0}
.cabtop .rolesel{margin-left:auto;color:#cdd5d0}
.cabbody{max-width:1040px;margin:0 auto;padding:18px 16px 40px}
.cabtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.cabtabs .tab{border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.cabtabs .tab.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
#posCart{display:none}#posCart.open{display:block;position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 20px));max-height:calc(100% - 20px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#cartBk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49}#cartBk.on{display:block}
#cartFab{display:none;position:fixed;right:14px;bottom:78px;z-index:21;box-shadow:var(--shadow)}#cartFab.on{display:inline-flex}
.pos{grid-template-columns:1fr!important}
.tl{display:flex;margin:12px 0 2px}.tl>div{flex:1;text-align:center;font-size:10.5px;color:var(--ink-2);position:relative;padding-top:20px;line-height:1.2}
.tl>div:before{content:'';position:absolute;top:2px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--line);z-index:1}
.tl>div:after{content:'';position:absolute;top:7px;left:-50%;right:50%;height:2px;background:var(--line)}
.tl>div:first-child:after{display:none}.tl>.done:before,.tl>.done:after{background:var(--brand)}.tl>.cur{color:var(--ink);font-weight:800}
.subw{touch-action:none;cursor:grab;position:fixed;right:16px;bottom:18px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.subpop{display:none;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow)}.subpop.on{display:flex}
.socl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:700}.socl:hover{background:var(--brand-soft)}.socl svg{width:22px;height:22px;flex:none}.socl.off{opacity:.45}
.subbtn{border-radius:99px;padding:10px 16px;box-shadow:var(--shadow)}.subbtn svg{width:18px;height:18px}
.ovl{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.pos{grid-template-columns:1fr}}
@media (max-width:900px){
  #side{position:fixed;inset:0 auto 0 0;transform:translateX(-102%);transition:transform .22s ease;width:270px}
  #side.open{transform:none}
  .ovl.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
  #menuBtn{display:inline-grid}
  #top{padding:10px 14px}#tabs{padding:8px 14px 0}#view{padding:14px 14px 96px}
  .rolesel span{display:none}.rolesel select{max-width:118px}.kpi b{font-size:18px}
  #bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--side);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  #bottom button{flex:1;border:0;background:transparent;color:var(--side-dim);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;padding:6px 2px;border-radius:10px;cursor:pointer}
  #bottom button svg{width:20px;height:20px}
  #bottom button.on{color:#fff;background:var(--brand)}
}
@media (max-width:640px){
  .g2,.g3,.g4,.fg{grid-template-columns:1fr}
  .g4.k{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hb{grid-template-columns:90px 1fr auto}
  .t td[data-l]{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
'use strict';
const LS='temuriy_business_v1';
const DCID='temuriy_device_cust_v1';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n||0).toLocaleString('ru-RU').replace(/[  ]/g,' ');

function createSale({items,wh,emp,cust,disc,pay,key,orderId,cash,due,bonusUse,bonusPre}){
 if(key&&S.sales.some(s=>s.key===key))return{err:'Bu savdo allaqachon qayd etilgan. Takroriy yuborish to‘xtatildi.'};
 if(!items.length)return{err:'Savat bo‘sh. Avval mahsulot qo‘shing.'};
 if(!wh)return{err:'Qaysi ombordan sotilishi tanlanmagan.'};
 const nf={},nm={};items.forEach(i=>{if(isRz(i))nm[i.pid]=(nm[i.pid]||0)+i.qty;else nf[i.pid]=(nf[i.pid]||0)+i.qty});
 for(const pid of new Set([...Object.keys(nf),...Object.keys(nm)])){const p=P(pid);if(!p)return{err:'Mahsulot topilmadi.'};const f=nf[pid]||0,m=nm[pid]||0,have=p.stock[wh]||0;if(have<f)return{err:`“${p.name}” omborda yetarli emas: qoldiq ${have}, kerak ${f}.`};
  if(m){if(!p.razliv)return{err:`“${p.name}” razlivga sotilmaydi.`};if(m<(p.rMin||1))return{err:`“${p.name}” razlivi kamida ${p.rMin} ml bo‘lishi kerak.`};const av=(have-f)*p.ml+poolOf(p,wh);if(av<m)return{err:`“${p.name}” razlivi yetarli emas: mavjud ${av} ml, kerak ${m} ml.`}}}
 const lines=items.map(i=>{const p=P(i.pid);return{pid:i.pid,qty:i.qty,price:i.price==null?unitPrice(i):i.price,cost:isRz(i)?p.cost/p.ml:p.cost,mode:isRz(i)?'razliv':'flakon'}});
 const sub=sum(lines,l=>l.qty*l.price);disc=Math.max(0,disc||0);
 if(disc>sub)return{err:'Chegirma jami summadan oshib ketdi.'};
 const bu=Math.round(bonusUse||0),cc=C(cust);if(bu>0){if(!cc)return{err:'Bonus ishlatish uchun mijozni tanlang.'};if(!bonusPre){if(bu>(cc.bonus||0))return{err:'Mijozda bonus yetarli emas.'};const mx=Math.floor((sub-disc)*(S.settings.bonusMaxPct||50)/100);if(bu>mx)return{err:'Bonus bilan jami summaning '+(S.settings.bonusMaxPct||50)+'% gacha to‘lash mumkin ('+som(mx)+').'}}if(disc+bu>sub)return{err:'Bonus jami summadan oshib ketdi.'};disc+=bu}

 lines.filter(l=>!isRz(l)).forEach(l=>{P(l.pid).stock[wh]-=l.qty;mv(l.pid,'sotuv',wh,'',l.qty,s.no)});
 lines.filter(isRz).forEach(l=>{const p=P(l.pid);p.pool=p.pool||{};let op=0;while(poolOf(p,wh)<l.qty){p.stock[wh]--;p.pool[wh]=poolOf(p,wh)+p.ml;op++}p.pool[wh]-=l.qty;if(op)mv(l.pid,'razlivga ochildi (flakon)',wh,'',op,s.no);mv(l.pid,'razliv sotuv (ml)',wh,'',l.qty,s.no)});

function reverseSale(id,reason,mode){const s=S.sales.find(x=>x.id===id);if(!s||s.status!=='confirmed')return'Bu savdoni qaytarib bo‘lmaydi.';
 s.status=mode==='cancel'?'cancelled':'returned';s.reason=reason;
 s.items.forEach(l=>{const p=P(l.pid);if(p){if(isRz(l)){p.pool=p.pool||{};p.pool[s.wh]=poolOf(p,s.wh)+l.qty;mv(l.pid,(mode==='cancel'?'bekor':'qaytarish')+' (razliv, ml)','',s.wh,l.qty,s.no)}else{p.stock[s.wh]=(p.stock[s.wh]||0)+l.qty;mv(l.pid,mode==='cancel'?'bekor':'qaytarish (mijozdan)','',s.wh,l.qty,s.no)}}});
 const c=C(s.cust);if(c&&s.bonus)c.bonus=Math.max(0,(c.bonus||0)-s.bonus);if(c&&s.bonusUsed)c.bonus=(c.bonus||0)+s.bonusUsed;

function stockOp(o){const p=P(o.pid);if(!p)return'Mahsulot tanlanmagan.';const q=o.qty;
 const out=(wh,n)=>{if((p.stock[wh]||0)<n)throw new Error(`${Bn(wh)} omborida “${p.name}” yetarli emas (qoldiq ${p.stock[wh]||0}).`);p.stock[wh]-=n};

 try{
  if(o.type!=='inventarizatsiya'&&!(q>0))return'Miqdor 0 dan katta bo‘lishi kerak.';
  if(o.type==='kirim'){inn(o.to,q);mv(p.id,'kirim','',o.to,q,o.note)}
  else if(o.type==='yuborish'){out('B0',q);inn(o.to,q);mv(p.id,'filialga yuborish','B0',o.to,q,o.note)}
  else if(o.type==='qaytarish'){out(o.from,q);inn('B0',q);mv(p.id,'filialdan qaytarish',o.from,'B0',q,o.note)}
  else if(o.type==='kochirish'){if(o.from===o.to)return'Ikkala ombor bir xil bo‘lmasligi kerak.';out(o.from,q);inn(o.to,q);mv(p.id,'ko‘chirish',o.from,o.to,q,o.note)}
  else if(o.type==='inventarizatsiya'){if(!(q>=0))return'Sanalgan miqdor 0 dan kam bo‘lmasin.';const d=q-(p.stock[o.wh]||0);p.stock[o.wh]=q;mv(p.id,'inventarizatsiya',o.wh,o.wh,d,(o.note||'')+' (farq '+(d>0?'+':'')+d+')')}
  else if(o.type==='kamomad'){out(o.wh,q);mv(p.id,'kamomad',o.wh,'',q,o.note)}
  else if(o.type==='buzilgan'){out(o.wh,q);mv(p.id,'buzilgan mahsulot',o.wh,'',q,o.note)}
  else if(o.type==='razliv'){out(o.wh,q);p.pool=p.pool||{};p.pool[o.wh]=poolOf(p,o.wh)+q*p.ml;mv(p.id,'razlivga ochish (flakon→ml)',o.wh,'',q,o.note)}
  else if(o.type==='ortiqcha'){inn(o.wh,q);mv(p.id,'ortiqcha mahsulot','',o.wh,q,o.note)}
 }catch(e){return e.message}
 log('Ombor',o.type+': '+p.name+' ×'+q);save()}

function drawModal(){const f=U.form,m=$('#modal');
 if(!f){m.innerHTML='';m.classList.remove('on');return}
 m.classList.add('on');
 m.innerHTML=`<div class="mbk" data-act="mclose"></div><form class="mdl${f.wide?' wide':''}" id="mform" novalidate role="dialog" aria-modal="true" aria-label="${esc(f.title)}"><div class="mh"><h3>${esc(f.title)}</h3><button type="button" class="ib" data-act="mclose" aria-label="Yopish">${ic('x')}</button></div><div class="mb">${f.html||`<div class="fg">${(f.fields||[]).map(fieldHtml).join('')}</div>`}</div>${f.err?`<div class="ferr" role="alert">${esc(f.err)}</div>`:''}<div class="mf"><button type="button" class="btn" data-act="mclose">${f.noSubmit?'Yopish':'Bekor qilish'}</button>${f.noSubmit?'':`<button class="btn pri" type="submit">${esc(f.okText||'Saqlash')}</button>`}</div></form>`;
 $('#mform').onsubmit=ev=>{ev.preventDefault();if(f.noSubmit)return closeForm();const vals=collect()||{};

 return `<div class="chartw"><svg viewBox="0 0 ${w} ${h+24}" class="chart" role="img" aria-label="Kunlik tushum diagrammasi">${[0,.5,1].map(f=>`<line x1="0" x2="${w}" y1="${h-h*f}" y2="${h-h*f}" stroke="var(--line)" stroke-width="1"/>`).join('')}${data.map((d,i)=>{const bh=Math.round(d.v/mx*h);return `<rect x="${i*32+8}" y="${h-bh}" width="20" height="${Math.max(bh,d.v>0?2:0)}" rx="4" class="bar${i===data.length-1?' last':''}"><title>${esc(d.l)}: ${som(d.v)}</title></rect><text x="${i*32+18}" y="${h+15}" text-anchor="middle" class="lb">${esc(d.s)}</text>`}).join('')}</svg></div>`}
function hbars(list,fmtv,cls){const mx=Math.max(1,...list.map(x=>x.v));if(!list.length)return '<div class="empty">Ma’lumot yo‘q.</div>';return list.map(x=>`<div class="hb"><span title="${esc(x.l)}">${esc(x.l)}</span><div class="tr"><i class="${x.cls||cls||''}" style="width:${Math.min(100,Math.max(1,x.v/mx*100))}%"></i></div><b>${fmtv?fmtv(x.v):som(x.v)}</b></div>`).join('')}

 <div class="split"><div class="card"><h3>Filiallar (oylik)</h3>${S.branches.filter(x=>!x.central&&pl.branch[x.id]>0&&(!sb||x.id===sb)).map(x=>{const v=metrics(a,b,x.id).rev;return `<div style="margin-bottom:10px"><div class="row sb"><b>${esc(x.name)}</b><span class="mut sm num">${som(v)} / ${som(pl.branch[x.id])}</span></div>${prog(pct(v,pl.branch[x.id]))}</div>`}).join('')||'<div class="empty">Filial rejasi belgilanmagan.</div>'}</div>

function prodForm(p){return[{k:'img',type:'image',label:'Rasm',val:p&&p.img,full:1,hint:'Rasm avtomatik kichraytiriladi. Bo‘sh qoldirsangiz, standart flakon chizmasi ko‘rinadi.'},{k:'name',label:'Nomi',req:1,val:p&&p.name},{k:'brand',label:'Brendi',req:1,val:p&&p.brand},{k:'ml',label:'Hajmi (ml)',type:'number',min:1,req:1,val:p&&p.ml},{k:'code',label:'Shtrix-kod / QR matni',val:p?p.code:'',hint:'Bo‘sh qoldirsangiz avtomatik beriladi.'},{k:'cost',label:'Tannarxi (so‘m)',type:'number',min:0,req:1,val:p&&p.cost},{k:'price',label:'Sotuv narxi (so‘m)',type:'number',min:0,req:1,val:p&&p.price},{k:'min',label:'Minimal qoldiq (dona)',type:'number',min:0,req:1,val:p?p.min:5},{k:'family',label:'Hid oilasi',type:'select',opts:[['','—']].concat(FAMS),val:p&&p.family},{k:'season',label:'Qaysi fasl uchun',type:'select',opts:[['','—']].concat(SEASONS),val:p&&p.season},{k:'tod',label:'Qachon surtiladi',type:'select',opts:[['','—'],'Kun','Kech','Har doim'],val:p&&p.tod},{k:'nTop',label:'Yuqori nota',val:p&&p.nTop},{k:'nMid',label:'O‘rta nota',val:p&&p.nMid},{k:'nBase',label:'Baza nota',val:p&&p.nBase},{k:'razliv',label:'Razlivga ham sotiladi',type:'checkbox',val:p?p.razliv:true,full:1},{k:'rPrice',label:'Razliv narxi (1 ml, so‘m)',type:'number',min:0,val:p?p.rPrice:0,hint:'Butun flakon narxidan alohida. Tannarx 1 ml: '+(p?som(p.cost/p.ml):'flakon tannarxi / hajm')},{k:'rMin',label:'Eng kam razliv (ml)',type:'number',min:1,val:p?p.rMin:5},{k:'rStep',label:'Razliv qadami (ml)',type:'number',min:1,val:p?p.rStep:5}]}
function rzCheck(v){if(v.razliv){if(!(v.rPrice>0))return 'Razliv narxini kiriting yoki “Razlivga ham sotiladi” belgisini olib tashlang.';if(v.rPrice<v.cost/v.ml)return 'Razliv narxi 1 ml tannarxidan ('+som(v.cost/v.ml)+') past. Narxni tekshiring.'}return ''}
function prodFormSimple(){return[{k:'name',label:'Mahsulot nomi',req:1},{k:'brand',label:'Brendi',req:1},{k:'ml',label:'Atir hajmi (ml)',type:'number',min:1,req:1,val:100},{k:'qty',label:'Qoldiq (dona)',type:'number',min:0,req:1,val:1},{k:'rPrice',label:'Razliv narxi (1 ml, so‘m)',type:'number',min:0,hint:'Bo‘sh qoldirsangiz, tannarxdan avtomatik hisoblanadi.'},{k:'cost',label:'Butun flakon tannarxi (so‘m)',type:'number',min:0,req:1},{k:'price',label:'Butun flakon sotuv narxi (so‘m)',type:'number',min:0,req:1}]}
A.addProduct=()=>{if(!guard('a','warehouse'))return;openForm({title:'Yangi mahsulot',fields:prodFormSimple(),submit:v=>{let rp=v.rPrice;if(!(rp>0))rp=Math.round(v.cost/v.ml*1.3/100)*100;if(v.ml>0&&rp<v.cost/v.ml){rp=Math.round(v.cost/v.ml*1.1/100)*100;toast('Razliv narxi tannarxdan past edi, avtomatik tuzatildi: '+som(rp)+'/ml.')}if(v.price<v.cost)toast('Diqqat: sotuv narxi tannarxdan past kiritildi.',true);const st={};S.branches.forEach(b=>st[b.id]=0);const wh=scopeB()&&scopeB()!=='__none'?scopeB():'B0';st[wh]=v.qty||0;S.products.push({img:'',id:'P'+uid(''),name:v.name.trim(),brand:v.brand.trim(),ml:v.ml,cost:v.cost,price:v.price,min:5,family:'',season:'',tod:'',nTop:'',nMid:'',nBase:'',razliv:true,rPrice:rp,rMin:5,rStep:5,pool:{},code:'8600'+String(Date.now()).slice(-9),stock:st});log('Mahsulot',v.name);save()}})};
A.editProduct=el=>{if(!guard('e','warehouse'))return;const p=P(el.dataset.id);openForm({title:'Mahsulotni tahrirlash',wide:true,fields:prodForm(p),submit:v=>{if(v.price<v.cost)return 'Sotuv narxi tannarxdan past. Narxlarni tekshiring.';const rc=rzCheck(v);if(rc)return rc;Object.assign(p,{img:v.img||'',family:v.family,season:v.season,tod:v.tod,nTop:v.nTop.trim(),nMid:v.nMid.trim(),nBase:v.nBase.trim(),razliv:v.razliv,rPrice:v.rPrice||0,rMin:v.rMin||5,rStep:v.rStep||5,name:v.name.trim(),brand:v.brand.trim(),ml:v.ml,cost:v.cost,price:v.price,min:v.min,code:v.code.trim()||p.code});log('Mahsulot','Tahrir: '+p.name);save()}})};
A.delProduct=el=>{if(!guard('d','warehouse'))return;const p=P(el.dataset.id);if(S.sales.some(s=>s.items.some(i=>i.pid===p.id)))return toast('Savdosi bor mahsulotni o‘chirib bo‘lmaydi. Uning qoldig‘ini 0 qiling.',true);ask(p.name+' o‘chirilsinmi?',()=>{S.products=S.products.filter(x=>x!==p);log('Mahsulot','O‘chirildi: '+p.name);save()},'O‘chirish')};
A.prodInfo=el=>{const p=P(el.dataset.id);const mvs=S.moves.filter(m=>m.pid===p.id);const svg=qrSvg(p.code);openForm({title:p.name+' '+p.ml+' ml',wide:true,noSubmit:true,noFocus:true,html:`<div class="row" style="align-items:flex-start;margin-bottom:10px"><div style="width:110px">${bottle(p)}</div><div style="flex:1;min-width:200px" class="sm"><div><b>Brend:</b> ${esc(p.brand)}</div><div><b>Tannarx:</b> ${som(p.cost)} · <b>Sotuv:</b> ${som(p.price)} · <b>Marja:</b> ${pct(p.price-p.cost,p.price)}%</div><div><b>Shtrix-kod:</b> <code>${esc(p.code)}</code></div><div class="mut" style="margin-top:6px">Mahsulot rasmini yuklash serverli saqlash (storage) ulangach qo‘shiladi. Hozircha shartli rasm ko‘rsatiladi.</div></div>${svg?`<div class="qrbox">${svg}</div>`:''}</div><h4 style="margin:8px 0">Kirim va chiqim tarixi</h4>${tbl([{h:'Sana',f:m=>fdt(m.ts)},{h:'Amal',f:m=>esc(m.type)},{h:'Qayerdan',f:m=>m.from?esc(Bn(m.from)):'—'},{h:'Qayerga',f:m=>m.to?esc(Bn(m.to)):'—'},{h:'Miqdor',c:'r',f:m=>m.qty},{h:'Izoh',f:m=>esc(m.note)}],mvs.slice(0,40),'Harakat yo‘q.')}`})};
R.warehouse.products=()=>{const sb=scopeB();return `<div class="fbar">${can('a','warehouse')?btn('addProduct','Mahsulot qo‘shish',{k:'pri',i:'plus'}):''}<span class="mut sm">Tannarx va sotuv narxi alohida saqlanadi.</span></div>`+tbl([{h:'Mahsulot',f:p=>`<b>${esc(p.name)}</b><div class="mut sm">${esc(p.brand)} · ${p.ml} ml</div>`},{h:'Tannarx',c:'r',f:p=>som(p.cost)},{h:'Flakon narxi',c:'r',f:p=>som(p.price)},{h:'Razliv (1 ml)',c:'r',f:p=>p.razliv?som(p.rPrice):'<span class="mut">sotilmaydi</span>'},{h:'Qoldiq',c:'r',f:p=>{const q=sb?(p.stock[sb]||0):stockTotal(p),pl=sb?poolOf(p,sb):sum(S.branches,b=>poolOf(p,b.id));return `<b>${q}</b>`+(pl?` <span class="mut sm">+ ochiq ${pl} ml</span>`:'')}},{h:'Minimum',c:'r',f:p=>p.min},{h:'Holat',f:p=>lowOf(p)?pill('Kam qolgan','bad'):pill('Yetarli','ok')},{h:'Kod',f:p=>`<code class="sm">${esc(p.code)}</code>`},{h:'',c:'act',f:p=>btn('prodInfo','',{sm:1,i:'eye',d:{id:p.id},title:'Tarix va QR'})+(U.role==='admin'?btn('editStock','',{sm:1,i:'box',d:{id:p.id},title:'Qoldiqni tahrirlash'}):'')+(can('e','warehouse')?btn('editProduct','',{sm:1,i:'edit',d:{id:p.id},title:'Tahrirlash'}):'')+(can('d','warehouse')?btn('delProduct','',{sm:1,i:'trash',d:{id:p.id},title:'O‘chirish'}):'')}],S.products,'Mahsulot yo‘q. “Mahsulot qo‘shish” tugmasini bosing.')};
A.editStock=el=>{if(U.role!=='admin')return toast('Qoldiqni faqat administrator tahrirlay oladi.',true);const p=P(el.dataset.id);const f=S.branches.map(b=>({k:'q_'+b.id,label:b.name,type:'number',min:0,req:1,val:p.stock[b.id]||0}));f.push({k:'note',label:'Izoh (ixtiyoriy)',full:1});openForm({title:p.name+' — qoldiqni tahrirlash',fields:f,okText:'Saqlash',submit:v=>{let changed=false;S.branches.forEach(b=>{const nq=v['q_'+b.id],old=p.stock[b.id]||0;if(nq!==old){const d=nq-old;p.stock[b.id]=nq;mv(p.id,'qoldiq to‘g‘irlandi (admin)',b.id,b.id,d,(v.note||'')+' (farq '+(d>0?'+':'')+d+')');changed=true}});if(changed){log('Ombor','Qoldiq to‘g‘irlandi: '+p.name);save()}}})};
R.warehouse.stock=()=>{const sb=scopeB();const brs=S.branches.filter(b=>!sb||b.id===sb);return `<p class="mut sm" style="margin-top:0">Markaziy ombor va har bir filial ombori alohida hisoblanadi. Savdo bo‘lganda mahsulot tegishli filial omboridan avtomatik kamayadi.</p>`+tbl([{h:'Mahsulot',f:p=>`<b>${esc(p.name)}</b> <span class="mut sm">${p.ml} ml</span>`}].concat(brs.map(b=>({h:b.name,c:'r',f:p=>{const q=p.stock[b.id]||0;return `<span style="${q<=Math.ceil(p.min/3)?'color:var(--bad);font-weight:800':''}">${q}</span>`}}))).concat([{h:'Jami',c:'r',f:p=>`<b>${sum(brs,b=>p.stock[b.id]||0)}</b>`}]),S.products,'Mahsulot yo‘q.')+`<div class="card" style="margin-top:14px"><h3>Ombor qiymati (tannarx bo‘yicha)</h3>${hbars(brs.map(b=>({l:b.name,v:sum(S.products,p=>(p.stock[b.id]||0)*p.cost)})))}</div>`};
const OPS=[['kirim','Mahsulot kirimi'],['yuborish','Filialga yuborish (markaziy ombordan)'],['qaytarish','Filialdan qaytarish (markaziyga)'],['kochirish','Filiallararo ko‘chirish'],['inventarizatsiya','Inventarizatsiya (sanalgan qoldiq)'],['kamomad','Kamomad'],['razliv','Razlivga ochish (flakon → ml)'],['ortiqcha','Ortiqcha mahsulot'],['buzilgan','Buzilgan mahsulot']];
R.warehouse.ops=()=>`<div class="grid gA">${OPS.map(([k,l])=>`<button class="card kpi" style="text-align:left;cursor:pointer" data-act="stockOp" data-k="${k}" ${can('a','warehouse')?'':'disabled'}><small>Operatsiya</small><b style="font-size:16px">${l}</b></button>`).join('')}</div>${can('a','warehouse')?'':'<p class="mut sm">Ombor operatsiyalari uchun ruxsat berilmagan.</p>'}`;
A.stockOp=el=>{if(!guard('a','warehouse'))return;const k=el.dataset.k,sb=scopeB(),mine=sb&&sb!=='__none';
 if(mine&&['kirim','yuborish','kochirish'].includes(k))return toast('Bu operatsiyani faqat markaziy ombor mas’uli yoki administrator bajaradi.',true);
 const whAll=mine?brOpts(true).filter(o=>o[0]===sb):brOpts(true),brOnly=brOpts(false),f=[{k:'pid',label:'Mahsulot',type:'select',opts:prodOpts(),req:1}];
 if(k==='kirim')f.push({k:'to',label:'Qaysi omborga',type:'select',opts:whAll,val:'B0'});
 if(k==='yuborish')f.push({k:'to',label:'Qaysi filialga',type:'select',opts:brOnly});
 if(k==='qaytarish')f.push({k:'from',label:'Qaysi filialdan',type:'select',opts:mine?whAll:brOnly});
 if(k==='kochirish'){f.push({k:'from',label:'Qayerdan',type:'select',opts:whAll},{k:'to',label:'Qayerga',type:'select',opts:whAll,val:(whAll[1]||whAll[0])[0]})}
 if(['inventarizatsiya','kamomad','ortiqcha','buzilgan','razliv'].includes(k))f.push({k:'wh',label:'Ombor',type:'select',opts:whAll});
 f.push({k:'qty',label:k==='inventarizatsiya'?'Sanalgan haqiqiy qoldiq':'Miqdor (dona)',type:'number',min:k==='inventarizatsiya'?0:1,req:1},{k:'note',label:'Izoh',type:'textarea',full:1});
 openForm({title:OPS.find(o=>o[0]===k)[1],fields:f,submit:v=>stockOp({...v,type:k})})};
R.warehouse.moves=()=>{const sb=scopeB();const rows=S.moves.filter(m=>!sb||m.from===sb||m.to===sb).slice(0,150);return tbl([{h:'Sana',f:m=>fdt(m.ts)},{h:'Mahsulot',f:m=>esc((P(m.pid)||{name:'—'}).name)},{h:'Amal',f:m=>pill(m.type,/kirim|qaytarish|ortiqcha/.test(m.type)?'ok':/kamomad|buzilgan|bekor/.test(m.type)?'bad':'')},{h:'Qayerdan',f:m=>m.from?esc(Bn(m.from)):'—'},{h:'Qayerga',f:m=>m.to?esc(Bn(m.to)):'—'},{h:'Miqdor',c:'r',f:m=>m.qty},{h:'Izoh',f:m=>esc(m.note)},{h:'Kim',f:m=>esc(m.user)}],rows,'Harakat yo‘q.')};

const salRate=e=>{const b=e.stype==='Soatbay'?'Soatiga '+som(e.hourRate||0):e.stype==='Foiz'?'Faqat savdodan':'Oylik '+som(e.base||0);return b+(e.rate?' + savdodan '+e.rate+'% bonus':'')};
function empForm(e){return[{k:'name',label:'F.I.Sh.',req:1,val:e&&e.name},{k:'pin',label:'Kirish PIN kodi (4 ta raqam)',val:e?e.pin:'',ph:'masalan 1234',hint:'Xodim ilovada “Ishga keldim” tugmasini bosganda shu kodni teradi. Boshqa xodimning kodi bilan bir xil bo‘lmasin.'},{k:'title',label:'Lavozim',req:1,val:e&&e.title,ph:'Sotuvchi'},{k:'branch',label:'Filial',type:'select',opts:brOpts(true),val:e&&e.branch},{k:'joined',label:'Ishga kirgan sana',type:'date',req:1,val:e?e.joined:ymd(new Date())},{k:'stype',label:'Ish haqi turi',type:'select',opts:[['Oylik','Oylik (belgilangan)'],['Soatbay','Soatbay (ishlagan soatiga)'],['Foiz','Faqat savdodan foiz']],val:e?(e.stype==='Aralash'?'Oylik':e.stype):'Oylik'},{k:'base',label:'Oylik miqdori (so‘m)',type:'number',min:0,val:e?e.base:0,hint:'Faqat “Oylik” turi uchun.'},{k:'hourRate',label:'Soat haqi (so‘m / soat)',type:'number',min:0,val:e?(e.hourRate||0):0,hint:'Faqat “Soatbay” turi uchun. Soatlar davomatdagi keldi/ketdi vaqtidan hisoblanadi.'},{k:'rate',label:'Savdodan bonus (%)',type:'number',min:0,step:'0.1',val:e?e.rate:0,hint:'Har turdagi xodimga qo‘shimcha beriladi. Faqat to‘langan savdodan hisoblanadi.'},{k:'active',label:'Faol',type:'checkbox',val:e?e.active:true}]}
const pinChk=(pin,self)=>{const p=(pin||'').trim();if(!/^\d{4}$/.test(p))return 'PIN kod aynan 4 ta raqamdan iborat bo‘lsin.';if(S.employees.some(e=>e!==self&&e.active&&e.pin===p))return 'Bu PIN kod boshqa xodimda band. Boshqa kod kiriting.';return ''}
A.addEmp=()=>{if(!guard('a','staff'))return;openForm({title:'Yangi xodim',wide:true,fields:empForm(),submit:v=>{const pe=pinChk(v.pin);if(pe)return pe;const id='E'+uid('');S.employees.push({id,pin:v.pin.trim(),name:v.name.trim(),title:v.title.trim(),branch:v.branch,joined:v.joined,stype:v.stype,base:v.base||0,hourRate:v.hourRate||0,rate:v.rate||0,active:v.active});log('Xodim',v.name);save()}})};

A.delEmp=el=>{if(!guard('d','staff'))return;const e=E(el.dataset.id);if(S.sales.some(s=>s.emp===e.id))return toast('Savdosi bor xodimni o‘chirib bo‘lmaydi. Uni faol emas qiling.',true);ask(e.name+' o‘chirilsinmi?',()=>{S.employees=S.employees.filter(x=>x!==e);log('Xodim','O‘chirildi: '+e.name);save()},'O‘chirish')};
R.staff.list=()=>{const sb=scopeB();const rows=S.employees.filter(e=>!sb||e.branch===sb);return `<div class="fbar">${can('a','staff')?btn('addEmp','Xodim qo‘shish',{k:'pri',i:'plus'}):''}</div>`+tbl([{h:'Xodim',f:e=>`<b>${esc(e.name)}</b><div class="mut sm">${esc(e.title)}</div>`},{h:'Filial',f:e=>esc(Bn(e.branch))},{h:'Ishga kirgan',f:e=>fds(e.joined)},{h:'Ish haqi turi',f:e=>esc(salRate(e))},{h:'Oylik',c:'r',f:e=>som(e.base)},{h:'Holat',f:e=>e.active?pill('Faol','ok'):pill('Faol emas')},{h:'',c:'act',f:e=>(can('e','staff')?btn('editEmp','',{sm:1,i:'edit',d:{id:e.id},title:'Tahrirlash'}):'')+(can('d','staff')?btn('delEmp','',{sm:1,i:'trash',d:{id:e.id},title:'O‘chirish'}):'')}],rows,'Xodim yo‘q. “Xodim qo‘shish” tugmasini bosing.')};

 const a=S.attendance.filter(x=>emps.some(e=>e.id===x.emp)).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,120);

 out.push({k:'data',h:'Qaysi atirni ko‘proq xarid qilish kerak',t:buy.length?buy.map(x=>`${x.p.name}: hozirgi sotuv tezligida ${Math.max(0,Math.floor(x.cover))} kunga yetadi (qoldiq ${stockTotal(x.p)}).`).join(' '):'Hozirgi sotuv tezligida 3 haftadan oldin tugaydigan mahsulot yo‘q.'});

R.marketing.content=()=>`<div class="fbar">${can('a','marketing')?btn('addContent','Kontent qo‘shish',{k:'pri',i:'plus'}):''}</div>`+tbl([{h:'Sana',f:c=>fds(c.date)},{h:'Kanal',f:c=>esc(c.channel)},{h:'Mavzu',f:c=>`<b>${esc(c.topic)}</b>`},{h:'Holat',f:c=>pill(c.status,c.status==='Chop etildi'?'ok':c.status==='Tayyor'?'br':'')},{h:'',c:'act',f:c=>(can('e','marketing')&&c.status!=='Chop etildi'?btn('contNext','→ '+(c.status==='Rejada'?'Tayyor':'Chop etildi'),{sm:1,d:{id:c.id}}):'')+(can('d','marketing')?btn('contDel','',{sm:1,i:'trash',d:{id:c.id},title:'O‘chirish'}):'')}],S.content,'Kontent rejasi bo‘sh.');
A.addContent=()=>{if(!guard('a','marketing'))return;openForm({title:'Kontent rejasi',fields:[{k:'topic',label:'Mavzu',req:1,full:1},{k:'channel',label:'Kanal',type:'select',opts:['Instagram','Telegram','Web-kabinet','Banner','Flayer']},{k:'date',label:'Sana',type:'date',req:1,val:ymd(new Date())}],submit:v=>{S.content.push({id:uid('K'),date:v.date,channel:v.channel,topic:v.topic.trim(),status:'Rejada'});save()}})};

A.contDel=el=>{if(!guard('d','marketing'))return;S.content=S.content.filter(x=>x.id!==el.dataset.id);save();render()};

function expForm(){return[{k:'group',label:'Guruh',type:'select',opts:Object.keys(EXP_GROUPS)},{k:'cat',label:'Turi',type:'select',opts:Object.values(EXP_GROUPS).flat().filter((v,i,a)=>a.indexOf(v)===i),hint:'Guruhga mos turni tanlang (masalan, Reklama → Instagram).'},{k:'amount',label:'Summa (so‘m)',type:'number',min:1,req:1},{k:'branch',label:'Filial',type:'select',opts:brOpts(true).map(([v,l])=>[v,v==='B0'?'Umumiy / markaziy':l]),val:scopeB()&&scopeB()!=='__none'?scopeB():'B0'},{k:'date',label:'Sana',type:'date',req:1,val:ymd(new Date())},{k:'note',label:'Izoh',type:'textarea',full:1}]}
A.addExpense=()=>{if(!guard('a','expenses'))return;openForm({title:'Xarajat kiritish',wide:true,fields:expForm(),submit:v=>{if(!EXP_GROUPS[v.group].includes(v.cat))return `“${v.cat}” turi “${v.group}” guruhiga kirmaydi. Mos turni tanlang.`;const big=v.amount>S.settings.expApprove&&U.role!=='admin';S.expenses.unshift({id:uid('X'),ts:pd(v.date)+12*3600e3,group:v.group,cat:v.cat,amount:v.amount,branch:v.branch,note:v.note.trim(),status:big?'pending':'approved'});log('Xarajat',v.group+' / '+v.cat+' '+som(v.amount)+(big?' (tasdiq kutilmoqda)':''));save();if(big)toast('Summa limitdan katta. Administrator tasdiqlagach hisobga olinadi.')}})};
A.expOk=el=>{if(!guard('p','expenses'))return;const x=S.expenses.find(e=>e.id===el.dataset.id);x.status='approved';log('Xarajat tasdiqlandi',x.cat+' '+som(x.amount));save();render()};
A.expDel=el=>{if(!guard('d','expenses'))return;const x=S.expenses.find(e=>e.id===el.dataset.id);ask('Xarajat o‘chirilsinmi? ('+x.cat+', '+som(x.amount)+')',()=>{S.expenses=S.expenses.filter(e=>e!==x);log('Xarajat','O‘chirildi: '+x.cat+' '+som(x.amount));save()},'O‘chirish')};
R.expenses.list=()=>{const sb=scopeB();const rows=S.expenses.filter(x=>!sb||x.branch===sb).sort((a,b)=>b.ts-a.ts).slice(0,150);const [a,b]=range('month');const tot=sum(S.expenses.filter(x=>x.status==='approved'&&x.ts>=a&&x.ts<b&&(!sb||x.branch===sb)),x=>x.amount);
 return `<div class="row sb fbar"><div class="row">${can('a','expenses')?btn('addExpense','Xarajat kiritish',{k:'pri',i:'plus'}):''}</div><span class="mut">Shu oy tasdiqlangan: <b class="num" style="color:var(--ink)">${som(tot)}</b></span></div>`+tbl([{h:'Sana',f:x=>fd(x.ts)},{h:'Guruh',f:x=>pill(x.group,'br')},{h:'Turi',f:x=>esc(x.cat)},{h:'Filial',f:x=>x.branch==='B0'?'Umumiy':esc(Bn(x.branch))},{h:'Summa',c:'r',f:x=>`<b>${som(x.amount)}</b>`},{h:'Izoh',f:x=>esc(x.note||'—')},{h:'Holat',f:x=>x.status==='approved'?pill('Tasdiqlangan','ok'):pill('Tasdiq kutilmoqda','warn')},{h:'',c:'act',f:x=>(x.status==='pending'&&can('p','expenses')?btn('expOk','Tasdiqlash',{sm:1,k:'pri',d:{id:x.id}}):'')+(can('d','expenses')?btn('expDel','',{sm:1,i:'trash',d:{id:x.id},title:'O‘chirish'}):'')}],rows,'Xarajat kiritilmagan.')+`<p class="mut sm">${som(S.settings.expApprove)} dan katta xarajatni administrator bo‘lmagan foydalanuvchi kiritsa, tasdiqlanmaguncha foydaga ta’sir qilmaydi.</p>`};
R.expenses.budget=()=>{const sb=scopeB();const [a,b]=range('month');return `<div class="grid g3">${Object.keys(EXP_GROUPS).map(g=>{const s=sum(S.expenses.filter(x=>x.group===g&&x.status==='approved'&&x.ts>=a&&x.ts<b&&(!sb||x.branch===sb)),x=>x.amount),l=S.budgets[g]||0,p=pct(s,l);return `<div class="card"><div class="row sb"><h3 style="margin:0">${g}</h3>${l>0&&s>l?pill('Limitdan oshdi','bad'):l>0&&p>=80?pill('Limitga yaqin','warn'):pill('Me’yorda','ok')}</div><div class="num" style="margin:8px 0 6px"><b style="font-size:20px">${som(s)}</b> <span class="mut">/ ${l?som(l):'limit yo‘q'}</span></div>${l?prog(p,p>100?'bad':p>=80?'warn':''):''}</div>`}).join('')}</div>${can('e','expenses')?`<div style="margin-top:14px">${btn('editBudget','Oylik budjet va limitlarni belgilash',{k:'pri',i:'edit'})}</div>`:''}<div class="card" style="margin-top:14px"><h3>Turlar bo‘yicha (shu oy)</h3>${hbars(Object.values(EXP_GROUPS).flat().filter((v,i,a)=>a.indexOf(v)===i).map(c=>({l:c,v:sum(S.expenses.filter(x=>x.cat===c&&x.status==='approved'&&x.ts>=a&&x.ts<b&&(!sb||x.branch===sb)),x=>x.amount)})).filter(x=>x.v>0).sort((x,y)=>y.v-x.v))}</div>`};
A.editBudget=()=>{if(!guard('e','expenses'))return;openForm({title:'Oylik budjet',fields:Object.keys(EXP_GROUPS).map(g=>({k:g,label:g+' — oylik limit (so‘m)',type:'number',min:0,val:S.budgets[g]||0,hint:'0 — limit qo‘yilmaydi.'})).concat([{k:'__ap',label:'Tasdiq talab qilinadigan summa (so‘m)',type:'number',min:0,val:S.settings.expApprove}]),submit:v=>{Object.keys(EXP_GROUPS).forEach(g=>S.budgets[g]=v[g]||0);S.settings.expApprove=v.__ap||0;log('Budjet','Limitlar yangilandi');save()}})};

R.settings.business=()=>{const s=S.settings;return `<div class="stack"><div class="split"><div class="card"><h3>Biznes ma’lumotlari</h3>${tbl([{h:'Maydon',f:r=>r[0]},{h:'Qiymat',f:r=>esc(r[1]||'—')}],[['Biznes nomi',s.biz],['Telefon',s.phone],['Manzil',s.addr],['Kabinet manzili (domen)',s.domain],['Do‘kon xarita havolasi',s.shopMap],['Instagram havolasi',(s.social||{}).ig],['Telegram kanal havolasi',(s.social||{}).tg],['Valyuta','O‘zbekiston so‘mi (UZS)'],['Til','O‘zbek'],['Sana formati',s.dateFmt],['Ish boshlanishi',s.workStart]])}<div style="margin-top:10px">${can('e','settings')?btn('editBiz','Tahrirlash',{k:'pri',i:'edit'}):''}</div></div><div class="card"><h3>Namuna ma’lumotlar</h3><p class="sm" style="margin-top:0">${S.demo?'Hozir ilovada <b>namuna</b> mahsulot, mijoz va savdolar bor. Ular real emas va faqat ilovani sinash uchun.':'Namuna ma’lumotlar o‘chirilgan, ilova bo‘sh holatda.'}</p>${can('e','settings')?(S.demo?btn('clearDemo','Namuna ma’lumotlarni o‘chirish',{k:'bad'}):btn('loadDemo','Namunani qayta yuklash')):''}</div></div><div class="card"><h3>To‘lov QR kodi</h3><p class="sm mut" style="margin-top:0">POS’da “QR kod” va “Aralash” to‘lov tanlanganda shu QR ko‘rsatiladi. Havolani administrator o‘zi kiritadi va o‘zgartiradi.</p>${s.payQr?`<div class="row" style="align-items:flex-start"><div class="qrbox">${qrSvg(s.payQr)}</div><div style="flex:1;min-width:200px"><code class="sm" style="word-break:break-all">${esc(s.payQr)}</code></div></div>`:'<div class="empty">QR havolasi kiritilmagan.</div>'}<div style="margin-top:10px">${can('e','settings')?btn('editPayQr',s.payQr?'Havolani o‘zgartirish':'Havola kiritish',{k:'pri',i:'edit'}):''}</div></div></div>`};
A.editBiz=()=>{if(!guard('e','settings'))return;const s=S.settings;openForm({title:'Biznes sozlamalari',wide:true,fields:[{k:'logo',type:'image',label:'Logotip (yumaloq)',val:s.logo,full:1,hint:'Kvadrat yoki yumaloq rasm yaxshi chiqadi. Bo‘sh qoldirsangiz, standart “T” belgisi ishlatiladi.'},{k:'biz',label:'Biznes nomi',req:1,val:s.biz},{k:'phone',label:'Telefon',val:s.phone},{k:'addr',label:'Manzil',val:s.addr,full:1},{k:'domain',label:'Kabinet manzili (domen)',val:s.domain,ph:'masalan, kabinet.sizningdomen.uz',hint:'QR kodlar shu manzilga yo‘naltiriladi. Domen serverga ulangandan keyin ishlaydi.',full:1},{k:'map',label:'Do‘kon xarita havolasi (Google Maps)',val:s.shopMap,ph:'https://maps.app.goo.gl/…',full:1,hint:'Bo‘sh qoldirsangiz, manzil bo‘yicha qidiruv ishlatiladi.'},{k:'ig',label:'Instagram havolasi',val:(s.social||{}).ig,ph:'https://instagram.com/…',full:1},{k:'tgl',label:'Telegram kanal havolasi',val:(s.social||{}).tg,ph:'https://t.me/…',full:1,hint:'Mijoz kabinetidagi “Obuna bo‘ling” tugmasida ko‘rinadi. Havola https:// bilan boshlansin.'},{k:'dateFmt',label:'Sana formati',type:'select',opts:['DD.MM.YYYY','YYYY-MM-DD'],val:s.dateFmt},{k:'ws',label:'Ish boshlanish vaqti',type:'time',val:s.workStart,req:1}],submit:v=>{const ig=v.ig.trim(),tgl=v.tgl.trim();if((ig&&!/^https:\/\/\S+$/i.test(ig))||(tgl&&!/^https:\/\/\S+$/i.test(tgl)))return 'Ijtimoiy tarmoq havolalari https:// bilan boshlanishi va bo‘sh joysiz bo‘lishi kerak.';const mp=v.map.trim();if(mp&&!/^https:\/\/\S+$/i.test(mp))return 'Xarita havolasi https:// bilan boshlanishi kerak.';s.logo=v.logo||'';s.shopMap=mp;s.social={ig,tg:tgl};Object.assign(s,{biz:v.biz.trim(),phone:v.phone.trim(),addr:v.addr.trim(),domain:v.domain.trim(),dateFmt:v.dateFmt,workStart:v.ws});log('Sozlama','Biznes ma’lumotlari');save()}})};
A.clearDemo=()=>{if(!guard('e','settings'))return;ask('Barcha namuna mahsulot, mijoz, savdo va xarajatlar o‘chiriladi. Sozlamalar, rollar va menyu saqlanadi. Davom etasizmi?',()=>{S=emptyFrom(S);save()},'Ha, o‘chirish')};

R.settings.users=()=>`<div class="fbar">${can('a','settings')?btn('addUser','Foydalanuvchi qo‘shish',{k:'pri',i:'plus'}):''}</div>`+tbl([{h:'Login',f:u=>`<b>${esc(u.login)}</b>`},{h:'Ism',f:u=>esc(u.name)},{h:'Rol',f:u=>pill(ROLES[u.role],'br')},{h:'Filial',f:u=>u.emp&&E(u.emp)?esc(Bn(E(u.emp).branch)):'—'},{h:'Holat',f:u=>u.active?pill('Faol','ok'):pill('Bloklangan','bad')},{h:'',c:'act',f:u=>u.role==='admin'?'':(can('e','settings')?btn('toggleUser',u.active?'Bloklash':'Faollashtirish',{sm:1,d:{id:u.id}}):'')}],S.users)+`<p class="mut sm">Mijoz akkauntlari Mijozlar bo‘limida yuritiladi (${S.customers.length} ta). Parol bilan kirish va akkauntni haqiqiy bloklash serverli bosqichda ishlaydi, hozir holat faqat belgilanadi.</p>`;
A.addUser=()=>{if(!guard('a','settings'))return;openForm({title:'Yangi foydalanuvchi',fields:[{k:'login',label:'Login',req:1},{k:'name',label:'Ism',req:1},{k:'role',label:'Rol',type:'select',opts:[['staff','Xodim'],['manager','Filial menejeri'],['admin','Administrator']]},{k:'emp',label:'Bog‘langan xodim',type:'select',opts:[['','—']].concat(empOpts())}],submit:v=>{if(S.users.some(u=>u.login.toLowerCase()===v.login.trim().toLowerCase()))return 'Bu login band.';S.users.push({id:'U'+uid(''),login:v.login.trim(),name:v.name.trim(),role:v.role,emp:v.emp,active:true});log('Foydalanuvchi',v.login);save()}})};
A.toggleUser=el=>{if(!guard('e','settings'))return;const u=S.users.find(x=>x.id===el.dataset.id);u.active=!u.active;log('Foydalanuvchi',u.login+(u.active?' faollashtirildi':' bloklandi'));save();render()};
R.settings.perms=()=>{const rl=U.tab.permRole||'staff';return `<div class="fbar"><label class="fd"><span>Rol</span><select data-chg="permRole"><option value="staff"${rl==='staff'?' selected':''}>Xodim</option><option value="manager"${rl==='manager'?' selected':''}>Filial menejeri</option></select></label></div><p class="mut sm" style="margin-top:0">Administrator hamma narsaga ruxsatli. Mijoz faqat o‘z kabinetini ko‘radi. Belgilangan ruxsatlar ilovadagi tugma va amallarni haqiqatan cheklaydi. Serverda ham tekshirish keyingi bosqichda qo‘shiladi.</p>`+tbl([{h:'Bo‘lim',f:s=>`<b>${esc(s.name)}</b>`}].concat(ACTS.map(([k,l])=>({h:l,c:'c',f:s=>`<input type="checkbox" style="width:auto" data-chg="permSet" data-r="${rl}" data-s="${s.id}" data-a="${k}" ${((S.perms[rl]||{})[s.id]||{})[k]?'checked':''} ${can('e','settings')?'':'disabled'} aria-label="${esc(s.name+' — '+l)}">`}))),S.nav)};
A.permRole=el=>{U.tab.permRole=el.value;render()};
A.permSet=el=>{if(!guard('e','settings')){render();return}const p=S.perms[el.dataset.r]=S.perms[el.dataset.r]||{};const o=p[el.dataset.s]=p[el.dataset.s]||{v:0,a:0,e:0,d:0,p:0,x:0};o[el.dataset.a]=el.checked?1:0;if(el.dataset.a!=='v'&&el.checked)o.v=1;if(el.dataset.a==='v'&&!el.checked)Object.keys(o).forEach(k=>o[k]=0);log('Ruxsat',ROLES[el.dataset.r]+' / '+el.dataset.s+' / '+el.dataset.a+' = '+(el.checked?'ha':'yo‘q'));save();render()};
R.settings.nav=()=>{const can_=can('e','settings');return `<p class="mut sm" style="margin-top:0">Bo‘limlarni qo‘shish, nomini o‘zgartirish, tartibini almashtirish, yashirish va o‘chirish mumkin. Yashirilgan bo‘lim hech kimning menyusida ko‘rinmaydi. Foydalanuvchiga ko‘rinishi “Ruxsatlar” orqali boshqariladi.</p><div class="fbar">${can('a','settings')?btn('addSec','Asosiy bo‘lim qo‘shish',{k:'pri',i:'plus'}):''}${can('e','settings')?btn('resetNav','Standart menyuga qaytarish'):''}</div><div class="card" style="padding:0">${S.nav.map((s,i)=>`<div class="navrow${s.visible?'':' off'}">${ic(s.icon)}<b>${esc(s.name)}</b>${can_?`${btn('navMv','',{sm:1,i:'up',d:{s:s.id,d:-1},title:'Yuqoriga'})}${btn('navMv','',{sm:1,i:'down',d:{s:s.id,d:1},title:'Pastga'})}${btn('navVis','',{sm:1,i:s.visible?'eye':'eyeoff',d:{s:s.id},title:s.visible?'Yashirish':'Faollashtirish'})}${btn('navRen','',{sm:1,i:'edit',d:{s:s.id},title:'Nomini o‘zgartirish'})}${btn('subAdd','',{sm:1,i:'plus',d:{s:s.id},title:'Ichki bo‘lim qo‘shish'})}${can('d','settings')?btn('navDel','',{sm:1,i:'trash',d:{s:s.id},title:'O‘chirish'}):''}`:''}</div>${s.subs.map(u=>`<div class="navrow sub${u.visible?'':' off'}"><b>${esc(u.name)}</b>${can_?`${btn('navMv','',{sm:1,i:'up',d:{s:s.id,u:u.id,d:-1},title:'Yuqoriga'})}${btn('navMv','',{sm:1,i:'down',d:{s:s.id,u:u.id,d:1},title:'Pastga'})}${btn('navVis','',{sm:1,i:u.visible?'eye':'eyeoff',d:{s:s.id,u:u.id},title:u.visible?'Yashirish':'Faollashtirish'})}${btn('navRen','',{sm:1,i:'edit',d:{s:s.id,u:u.id},title:'Nomini o‘zgartirish'})}${can('d','settings')?btn('navDel','',{sm:1,i:'trash',d:{s:s.id,u:u.id},title:'O‘chirish'}):''}`:''}</div>`).join('')}`).join('')}</div>`};
